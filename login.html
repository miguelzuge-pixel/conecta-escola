<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Conecta Escola - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body class="login-body">

    <div class="login-container">

        <div class="logo">
            🏫
        </div>

        <h1>Conecta Escola</h1>

        <p>Comunicação escolar em um só lugar.</p>

        <form id="loginForm">

            <label>E-mail</label>

            <input
                type="email"
                id="email"
                placeholder="Digite seu e-mail"
                required
            >

            <label>Senha</label>

            <input
                type="password"
                id="senha"
                placeholder="Digite sua senha"
                required
            >

            <label>Tipo de usuário</label>

            <select id="tipoUsuario">

                <option value="aluno">
                    Aluno
                </option>

                <option value="responsavel">
                    Responsável
                </option>

                <option value="professor">
                    Professor
                </option>

                <option value="admin">
                    Administrador
                </option>

            </select>

            <button type="submit">
                Entrar
            </button>

        </form>

        <p class="demo">
            Projeto educacional — login demonstrativo.
        </p>

    </div>

    <script src="js/script.js"></script>

</body>

</html>
