<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Conecta Escola</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

<header>

    <div>
        <h1>🏫 Conecta Escola</h1>
        <p>Portal de comunicação escolar</p>

</header>

<main>

    <section class="boas-vindas">

        <h2>
            Olá querido estudante! 👋
        </h2>

        <p id="usuario"></p>

    <section class="cards">

        <a href="avisos.html" class="card">

            <span>📢</span>

            <h3>Avisos</h3>

            <p>
                Consulte os comunicados

            </p>

        </a>


        <a href="perguntas.html" class="card">

            <span>❓</span>

            <h3>Perguntas</h3>

            <p>
                Envie suas dúvidas.
            </p>

        </a>


        <a href="documentos.html" class="card">

            <span>📁</span>

            <h3>Documentos</h3>

            <p>
                Acesse documentos.
            </p>

        </a>


        <a href="perfil.html" class="card">

            <span>👤</span>

            <h3>Perfil</h3>

            <p>

            </p>

<script src="js/script.js"></script>
